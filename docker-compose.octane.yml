# Octane canary stack. Runs BESIDE the existing php-fpm nodes and takes NO traffic until
# HAProxy is told to use it. Start with:
#   docker compose -p 130 -f docker-compose.yml -f docker-compose.octane.yml up -d --no-deps --no-build app-octane-1 web-octane-1   # image pre-loaded; never build on the live server
# --no-deps + explicit service names guarantee existing services are not recreated.
services:
  app-octane-1:
    image: 130-app-octane:phase2-rc11
    build:
      context: .
      dockerfile: Dockerfile.octane
    restart: unless-stopped
    secrets:
      - app_key
      - db_password
      - aws_secret_access_key
      - bidx_salt
      - audit_salt
    environment:
      - APP_NAME=${APP_NAME:-130 NHMP Helpline}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY_FILE=/run/secrets/app_key
      - APP_URL=${APP_URL:-https://130.nhmp.gov.pk}
      - FORCE_HTTPS=${FORCE_HTTPS:-true}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-*}
      - OCTANE_SERVER=roadrunner
      - OCTANE_WORKERS=${OCTANE_WORKERS:-12}
      - OCTANE_MAX_EXECUTION_TIME=${OCTANE_MAX_EXECUTION_TIME:-300}
      - DB_CONNECTION=mysql
      - DB_HOST=db-1
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-130_crm_db}
      - DB_USERNAME=${DB_USERNAME:-crm_user}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY_FILE=/run/secrets/aws_secret_access_key
      - BIDX_SALT_FILE=/run/secrets/bidx_salt
      - AUDIT_SALT_FILE=/run/secrets/audit_salt
      - AWS_BUCKET=crm-storage
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - crm-net


  app-octane-2:
    image: 130-app-octane:phase2-rc11
    build:
      context: .
      dockerfile: Dockerfile.octane
    restart: unless-stopped
    secrets:
      - app_key
      - db_password
      - aws_secret_access_key
      - bidx_salt
      - audit_salt
    environment:
      - APP_NAME=${APP_NAME:-130 NHMP Helpline}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY_FILE=/run/secrets/app_key
      - APP_URL=${APP_URL:-https://130.nhmp.gov.pk}
      - FORCE_HTTPS=${FORCE_HTTPS:-true}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-*}
      - OCTANE_SERVER=roadrunner
      - OCTANE_WORKERS=${OCTANE_WORKERS:-12}
      - OCTANE_MAX_EXECUTION_TIME=${OCTANE_MAX_EXECUTION_TIME:-300}
      - DB_CONNECTION=mysql
      - DB_HOST=db-1
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-130_crm_db}
      - DB_USERNAME=${DB_USERNAME:-crm_user}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY_FILE=/run/secrets/aws_secret_access_key
      - BIDX_SALT_FILE=/run/secrets/bidx_salt
      - AUDIT_SALT_FILE=/run/secrets/audit_salt
      - AWS_BUCKET=crm-storage
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - crm-net


  web-octane-1:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./public:/var/www/html/public
      - ./nginx-octane.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-octane-1
    networks:
      - crm-net

# Docker secrets (file-based; works without Swarm). Files live in ./secrets (mode 700, gitignored)
# and are mounted read-only at /run/secrets/<name> inside the container only — they do not appear in
# `docker inspect` environment output. Create them with scripts/create_secrets.sh.
  web-octane-2:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./public:/var/www/html/public
      - ./nginx-octane-2.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-octane-2
    networks:
      - crm-net

# Docker secrets (file-based; works without Swarm). Files live in ./secrets (mode 700, gitignored)
# and are mounted read-only at /run/secrets/<name> inside the container only — they do not appear in
# `docker inspect` environment output. Create them with scripts/create_secrets.sh.

  # Laravel scheduler (analytics:process-outbox every minute, analytics:reconcile daily, audit:add-partition monthly).
  # EXACTLY ONE instance. Serves no HTTP and takes no traffic. Queue workers are intentionally not run:
  # the app currently dispatches no queued jobs (see docker/supervisor/worker-isolated.conf for when that changes).
  scheduler:
    image: 130-app-octane:phase2-rc11
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    read_only: false
    security_opt:
      - no-new-privileges:true
    secrets:
      - app_key
      - db_password
      - aws_secret_access_key
      - bidx_salt
      - audit_salt
    environment:
      - APP_NAME=${APP_NAME:-130 NHMP Helpline}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY_FILE=/run/secrets/app_key
      - DB_CONNECTION=mysql
      - DB_HOST=db-1
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-130_crm_db}
      - DB_USERNAME=${DB_USERNAME:-crm_user}
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY_FILE=/run/secrets/aws_secret_access_key
      - BIDX_SALT_FILE=/run/secrets/bidx_salt
      - AUDIT_SALT_FILE=/run/secrets/audit_salt
      - AWS_BUCKET=crm-storage
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    networks:
      - crm-net

  # Restart policy for the base stack (docker-compose.yml defines none). Applied live with
  # `docker update --restart unless-stopped` on 2026-11-10; kept here so a recreate does not lose it.
  # NOTE: always use `up -d --no-deps --no-build <service>`; a bare `up -d` would recreate these.
  haproxy:
    restart: unless-stopped
  web-1:
    restart: unless-stopped
  web-2:
    restart: unless-stopped
  db-1:
    restart: unless-stopped
  db-2:
    restart: unless-stopped
  db-3:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  prometheus:
    restart: unless-stopped
  grafana:
    restart: unless-stopped
  node-exporter:
    restart: unless-stopped
  redis-exporter:
    restart: unless-stopped

secrets:
  app_key:
    file: ./secrets/app_key
  db_password:
    file: ./secrets/db_password
  aws_secret_access_key:
    file: ./secrets/aws_secret_access_key
  bidx_salt:
    file: ./secrets/bidx_salt
  audit_salt:
    file: ./secrets/audit_salt

networks:
  crm-net:
    external: true
    name: 130_crm-net
