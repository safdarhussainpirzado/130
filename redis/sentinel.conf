# ==============================================================================
# NHMP 130 Helpline — Redis Sentinel High-Availability Configuration
# Quorum: 2 (requires 2 sentinels to agree for automated failover)
# ==============================================================================

port 26379
dir /tmp

# Sentinel Monitor <master-name> <ip> <port> <quorum>
sentinel monitor nhmp-master redis 6379 2

# Failover Timing Specifications
# Detect master down after 5,000 ms (5 seconds) of unresponsiveness
sentinel down-after-milliseconds nhmp-master 5000

# Complete failover within 10,000 ms (10 seconds)
sentinel failover-timeout nhmp-master 10000

# Number of replicas that can be reconfigured in parallel
sentinel parallel-syncs nhmp-master 1

# Prevent scripts from reconfiguring arbitrary external binaries
sentinel deny-scripts-reconfig yes
