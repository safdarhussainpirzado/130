services:
  web:
    image: nginx:alpine
    ports:
      - "8085:80"
    volumes:
      - ./public:/var/www/html/public
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - crm-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=base64:XPR6X+Ibks30j/7BuAkleU7vtQqmsgST/OFnrBg2Gio=
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-130_crm_db}
      - DB_USERNAME=${DB_USERNAME:-crm_user}
      - DB_PASSWORD=${DB_PASSWORD:-crm_password}
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/storage
      - /var/www/html/bootstrap/cache
    networks:
      - crm-net

  db:
    image: mysql:8.4
    ports:
      - "3309:3306"
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-130_crm_db}
      - MYSQL_USER=${DB_USERNAME:-crm_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-crm_password}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro # Custom optimized config
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-net

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-net

networks:
  crm-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"

volumes:
  dbdata:
  redisdata:
  assets-build:
