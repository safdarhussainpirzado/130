x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  haproxy:
    image: haproxy:alpine
    logging: *default-logging
    environment:
      - HAPROXY_STATS_USER=${HAPROXY_STATS_USER:-admin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        export HAPROXY_STATS_PASSWORD=$$(cat /run/secrets/haproxy_stats_password 2>/dev/null || echo "$${HAPROXY_STATS_PASSWORD:-CandidateAdmin2026!Secure}")
        exec /usr/local/bin/docker-entrypoint.sh haproxy -f /usr/local/etc/haproxy/haproxy.cfg
    ports:
      - "80:80"
      - "443:443"
      - "7085:7085"
      - "8085:8085"
      - "127.0.0.1:8404:8404" # Stats page restricted to loopback
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro
    secrets:
      - haproxy_stats_password
    depends_on:
      - web-1
      - web-2
    networks:
      - crm-net

  web-1:
    image: nginx:alpine
    logging: *default-logging
    volumes:
      - ./public:/var/www/html/public
      - ./nginx-1.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-1
    networks:
      - crm-net

  web-2:
    image: nginx:alpine
    logging: *default-logging
    volumes:
      - ./public:/var/www/html/public
      - ./nginx-2.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-2
    networks:
      - crm-net

  app-1:
    image: ${APP_IMAGE:-130-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    stop_grace_period: 60s
    logging: *default-logging
    restart: unless-stopped
    environment: &app-env
      - APP_NAME=${APP_NAME:-130 NHMP Helpline}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY:-}
      - APP_URL=${APP_URL:-https://130.nhmp.gov.pk}
      - FORCE_HTTPS=${FORCE_HTTPS:-true}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-*}
      
      # LOCAL DATABASE
      - DB_CONNECTION=mysql
      - DB_HOST=db-1
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-130_crm_db}
      - DB_USERNAME=${DB_USERNAME:-crm_user}
      - DB_PASSWORD=${DB_PASSWORD:-}
      
      # LOCAL REDIS
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      
      # RUNTIME SERVER
      - APP_SERVER=roadrunner
      
      # LOCAL STORAGE
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-admin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_BUCKET=crm-storage
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    command: ["rr", "serve", "-c", ".rr.yaml"]
    volumes:
      - ./rr:/usr/local/bin/rr:ro
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - .:/var/www/html
    secrets:
      - app_key
      - bidx_salt
      - audit_salt
      - db_password
      - redis_password
      - minio_root_password
    networks:
      crm-net:
        aliases:
          - app-node

  app-2:
    image: ${APP_IMAGE:-130-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["rr", "serve", "-c", ".rr.yaml"]
    stop_grace_period: 60s
    logging: *default-logging
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./rr:/usr/local/bin/rr:ro
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - .:/var/www/html
    secrets:
      - app_key
      - bidx_salt
      - audit_salt
      - db_password
      - redis_password
      - minio_root_password
    networks:
      crm-net:
        aliases:
          - app-node

  db-1:
    image: mysql:8.4
    logging: *default-logging
    command: ["mysqld", "--server-id=1", "--binlog-checksum=NONE", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=mysql-bin", "--log-replica-updates=ON", "--binlog-format=ROW"]
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-130_crm_db}
      - MYSQL_USER=${DB_USERNAME:-crm_user}
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
    ports:
      - "127.0.0.1:3309:3306"
    secrets:
      - db_password
      - db_root_password
    volumes:
      - dbdata-1:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -p$$(cat /run/secrets/db_root_password 2>/dev/null || echo $$MYSQL_ROOT_PASSWORD)"]
    networks:
      - crm-net

  db-2:
    image: mysql:8.4
    command: ["mysqld", "--server-id=2", "--binlog-checksum=NONE", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=mysql-bin", "--log-replica-updates=ON", "--binlog-format=ROW"]
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-130_crm_db}
      - MYSQL_USER=${DB_USERNAME:-crm_user}
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
    ports:
      - "127.0.0.1:3310:3306"
    secrets:
      - db_password
      - db_root_password
    volumes:
      - dbdata-2:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - crm-net

  db-3:
    image: mysql:8.4
    command: ["mysqld", "--server-id=3", "--binlog-checksum=NONE", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--log-bin=mysql-bin", "--log-replica-updates=ON", "--binlog-format=ROW"]
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-130_crm_db}
      - MYSQL_USER=${DB_USERNAME:-crm_user}
      - MYSQL_PASSWORD_FILE=/run/secrets/db_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
    ports:
      - "127.0.0.1:3311:3306"
    secrets:
      - db_password
      - db_root_password
    volumes:
      - dbdata-3:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - crm-net

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-net

  minio:
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD_FILE=/run/secrets/minio_root_password
    ports:
      - "127.0.0.1:9000:9000"
    secrets:
      - minio_root_password
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks:
      - crm-net

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    secrets:
      - minio_root_password
    entrypoint: >
      /bin/sh -c "
      MINIO_PWD=\$$(cat /run/secrets/minio_root_password 2>/dev/null || echo \"\$${MINIO_ROOT_PASSWORD:-password}\");
      /usr/bin/mc alias set myminio http://minio:9000 admin \$$MINIO_PWD;
      /usr/bin/mc mb myminio/crm-storage;
      /usr/bin/mc anonymous set none myminio/crm-storage;
      exit 0;
      "
    networks:
      - crm-net

  # --- Monitoring Stack (Phase 5) ---
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - crm-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    networks:
      - crm-net

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - crm-net

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    entrypoint: >
      /bin/sh -c "
      echo '[client]' > /tmp/.my.cnf &&
      echo 'user=root' >> /tmp/.my.cnf &&
      echo 'password='\$$(cat /run/secrets/db_root_password) >> /tmp/.my.cnf &&
      echo 'host=db-1' >> /tmp/.my.cnf &&
      echo 'port=3306' >> /tmp/.my.cnf &&
      exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf
      "
    secrets:
      - db_root_password
    networks:
      - crm-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    command: ["-redis.addr", "redis:6379", "-redis.password-file", "/run/secrets/redis_password"]
    secrets:
      - redis_password
    networks:
      - crm-net

networks:
  crm-net:
    driver: bridge

volumes:
  dbdata-1:
  dbdata-2:
  dbdata-3:
  redisdata:
  miniodata:
  prometheusdata:
  grafanadata:

secrets:
  app_key:
    file: ./docker/secrets/app_key.txt
  bidx_salt:
    file: ./docker/secrets/bidx_salt.txt
  audit_salt:
    file: ./docker/secrets/audit_salt.txt
  db_password:
    file: ./docker/secrets/db_password.txt
  db_root_password:
    file: ./docker/secrets/db_root_password.txt
  redis_password:
    file: ./docker/secrets/redis_password.txt
  minio_root_password:
    file: ./docker/secrets/minio_root_password.txt
  haproxy_stats_password:
    file: ./docker/secrets/haproxy_stats_password.txt
  grafana_admin_password:
    file: ./docker/secrets/grafana_admin_password.txt
