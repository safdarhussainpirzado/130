server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/css;

    # Maximum upload/body size
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # High-performance Immutable Cache for Vite Versioned Assets
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static media and fonts
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Docker internal DNS resolver to dynamically track IP changes across container recreation
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $octane_backend "app-2:8000";

    location / {
        try_files $uri @octane;
    }

    location ~ \.php$ {
        return 302 /;
    }

    location @octane {
        proxy_pass http://$octane_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location = /up {
        proxy_pass http://$octane_backend/up;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    location = /healthz {
        proxy_pass http://$octane_backend/up;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.(config|env|log)$ {
        deny all;
    }
}
