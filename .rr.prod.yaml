# NHMP 130 PRODUCTION RoadRunner config = user's validated .rr.yaml (custom isolating worker) with prod tuning:
#  num_workers 4->12, max_worker_memory 128->768 MB (report exports), exec_ttl 300s, static assets served by RR (nginx passes through).
version: "3"

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php ./app/Octane/roadrunner_worker.php"
  relay: pipes

http:
  address: "0.0.0.0:8000"
  max_request_size: 64
  middleware: ["static", "gzip"]
  static:
    dir: "public"
    forbid: [".php", ".env", ".htaccess"]
  pool:
    num_workers: 12
    max_jobs: 1000
    allocate_timeout: 60s
    destroy_timeout: 60s
    supervisor:
      watch_tick: 1s
      exec_ttl: 300s
      ttl: 3600s
      idle_ttl: 600s
      max_worker_memory: 768

logs:
  mode: production
  level: warn
  encoding: json
