global
    log stdout format raw local0
    maxconn 10000
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5000
    timeout client  300000
    timeout server  300000
    timeout http-request 30000
    timeout http-keep-alive 15000
    retries 3
    option  redispatch

resolvers docker_dns
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout retry 1s
    hold valid 5s

listen stats
    bind *:8404
    stats enable
    stats uri /monitor
    stats auth admin:CandidateStatsPass2026

frontend http-in
    bind *:80
    http-request set-header X-Forwarded-Proto http
    default_backend app_nodes

frontend https-in
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port %[dst_port]
    http-response set-header Strict-Transport-Security max-age=31536000
    default_backend app_nodes

backend app_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /up ver HTTP/1.1 hdr Host localhost
    http-check expect status 200-399
    cookie SERVERID insert indirect nocache
    server web-1 130-candidate-web-1:80 check resolvers docker_dns init-addr none cookie web1
    server web-2 130-candidate-web-2:80 check resolvers docker_dns init-addr none cookie web2
