# nginx in front of Octane (RoadRunner). Static files from ./public, everything else proxied.
upstream octane_backend {
    server app-octane-1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    charset utf-8;
    client_max_body_size 20M;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.(config|env|log)$ { deny all; }

    location / {
        try_files $uri @octane;
    }

    location @octane {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_pass http://octane_backend;
        proxy_read_timeout 300s;   # large report exports
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }
}
