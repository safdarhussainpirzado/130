          \ Bhera rest area for 15 minutes break.\",\n  \"location_name\": \"Bhera\
          \ Rest Area M-2\",\n  \"latitude\": 32.48201,\n  \"longitude\": 72.9124\n\
          }"
        options:
          raw:
            language: json
      url:
        raw: '{{base_url}}/api/v1/womens-journey/{{journey_uuid}}/updates'
        host:
        - '{{base_url}}'
        path:
