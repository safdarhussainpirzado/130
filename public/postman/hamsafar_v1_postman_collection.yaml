      description: 'Screen W07: Returns current active transit journey and milestone
        history.'
  - name: 3.3 Post Milestone Check-In / In-Transit Note
    request:
      auth:
        type: bearer
        bearer:
        - key: token
          value: '{{commuter_token}}'
          type: string
      method: POST
      header:
      - key: Accept
        value: application/json
      - key: Content-Type
        value: application/json
      body:
