- name: 3. Women's Journey Safety Module (WJ-204)
  description: Specialized Public Service Vehicle (PSV) transit monitoring for women
    traveling alone.
  item:
  - name: 3.1 Register PSV Transit Journey
    event:
    - listen: test
      script:
        exec:
        - if (pm.response.code === 200 || pm.response.code === 201) {
        - '    var json = pm.response.json();'
        - '    if (json.journey_uuid) {'
        - '        pm.environment.set(''journey_uuid'', json.journey_uuid);'
        - '        console.log(''Journey UUID saved: '' + json.journey_uuid);'
        - '    }'
        - '}'
        type: text/javascript
    request:
      auth:
        type: bearer
        bearer:
        - key: token
          value: '{{commuter_token}}'
          type: string
      method: POST
      header:
      - key: Accept
        value: application/json
      - key: Content-Type
        value: application/json
      body:
        mode: raw
        raw: "{\n  \"origin_city\": \"Rawalpindi\",\n  \"origin_stop\": \"Faizabad\
          \ Bus Terminal\",\n  \"destination_city\": \"Lahore\",\n  \"destination_stop\"\
          : \"Thokar Niaz Baig Terminal\",\n  \"psv_company_name\": \"Daewoo Express\"\
          ,\n  \"psv_reg_no\": \"BS-942\",\n  \"psv_seat_no\": \"14-B\",\n  \"notes\"\
          : \"Traveling solo on night executive coach.\"\n}"
        options:
          raw:
            language: json
      url:
        raw: '{{base_url}}/api/v1/womens-journey/register'
        host:
        - '{{base_url}}'
        path:
        - api
        - v1
        - womens-journey
        - register
      description: 'Screens W01-W05: Registers PSV travel parameters. Starts active
        transit monitoring.'
  - name: 3.2 Query Active Transit Journey
    request:
      auth:
        type: bearer
        bearer:
        - key: token
          value: '{{commuter_token}}'
          type: string
      method: GET
