; ==============================================================================
; NHMP 130 Helpline CRM - PHP Security Hardening Configuration
; Compliance: National CERT Pakistan Advisory NCA-19.211026 (CVE-2026-109618 / CVE-2026-109619)
; ==============================================================================

; 1. Disable PHP session upload-progress to mitigate RCE attack vector
session.upload_progress.enabled = Off
session.upload_progress.cleanup = On

; 2. Enforce strict session handling (prevents uninitialized session ID acceptance)
session.use_strict_mode = On
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = "Lax"

; 3. Information Disclosure Prevention
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; 4. Execution Limits
max_execution_time = 30
max_input_time = 60
memory_limit = 512M
post_max_size = 25M
upload_max_filesize = 20M
