# Dev API gateway: exposes ONLY the public, read-only Travel Advisory endpoints to the LAN.
# Everything else (login, admin UI, authenticated Hamsafar/patrol APIs) returns 404.
# The local DB is a copy of production data, so nothing authenticated is exposed here.
worker_processes auto;
events { worker_connections 1024; }
http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connperip:10m;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    map $request_uri $allowed_path {
        default 0;
        ~^/api/v1/travel-advisory/(routes|query|ticker|geojson|landmarks)(\?.*)?$ 1;
        ~^/api/v1/advisories(/emergency-alerts)?(\?.*)?$ 1;
        ~^/gateway-health(\?.*)?$ 1;
    }

    server {
        listen 8480;
        client_max_body_size 50m;

        location ~ ^/gateway-health {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-TOKEN" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-TOKEN" always;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=perip burst=100 nodelay;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-TOKEN" always;
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                return 204;
            }

            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, X-CSRF-TOKEN" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-store" always;

            proxy_pass https://haproxy;
            proxy_ssl_verify off;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 60s;
        }
    }
}
