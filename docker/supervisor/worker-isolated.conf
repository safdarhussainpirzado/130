[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=www-data:www-data

[supervisord]
nodaemon=false
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ------------------------------------------------------------------------------
# POOL 1: Emergency Dispatch (Tiger dispatch, arrival, operational alerts)
# Priority: CRITICAL (Isolated 4 worker processes)
# ------------------------------------------------------------------------------
[program:nhmp-queue-dispatch]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=emergency_dispatch --sleep=1 --tries=3 --timeout=15 --backoff=2,5,10 --max-jobs=1000 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-dispatch.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=20

# ------------------------------------------------------------------------------
# POOL 3: Operational Notifications (SMS gateway, Push notifications, Webhooks)
# Priority: HIGH (Isolated 2 worker processes)
# ------------------------------------------------------------------------------
[program:nhmp-queue-notifications]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=notifications --sleep=2 --tries=3 --timeout=30 --backoff=5,15,60 --max-jobs=1000 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-notifications.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=35

# ------------------------------------------------------------------------------
# POOL 4: Analytics Rollups & Outbox Processing (Preaggregation, audit logs, default)
# Priority: MEDIUM (Isolated 2 worker processes)
# ------------------------------------------------------------------------------
[program:nhmp-queue-analytics]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=analytics_rollup,default --sleep=3 --tries=3 --timeout=60 --backoff=10,30,120 --max-jobs=500 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-analytics.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=65

# ------------------------------------------------------------------------------
# POOL 5: Heavy Reporting & Exports (Large CSV, Excel, PDF generation)
# Priority: LOW (Isolated 1 worker process with high memory ceiling)
# ------------------------------------------------------------------------------
[program:nhmp-queue-reports]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=heavy_reports --sleep=5 --tries=2 --timeout=300 --backoff=30,120 --max-jobs=100 --max-time=3600 --memory=512
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-reports.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=310
