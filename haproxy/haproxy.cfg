global
    log stdout format raw local0
    maxconn 4096
    stats socket /tmp/haproxy.sock mode 660 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 10000
    timeout client  300000
    timeout server  300000
    timeout http-request 30000
    timeout http-keep-alive 15000

# Stats Page
listen stats
    bind *:8404
    stats enable
    stats uri /monitor
    stats refresh 5s
    stats auth admin:REPLACE_ON_SERVER  # real password lives only in prod haproxy.cfg + /root/.haproxy_stats_password; never rsync this file over prod

# HTTP Frontend (Port 80 for Let's Encrypt / redirects & Port 8085 for internal HTTP)
frontend http-in
    bind *:80
    bind *:8085
    acl is_acme path_beg /.well-known/acme-challenge/
    acl from_lb src 10.1.2.62
    acl is_forwarded_https hdr(X-Forwarded-Proto) https
    acl is_internal_8085 dst_port 8085

    # Pass Let's Encrypt challenge directly without redirect
    use_backend app_nodes if is_acme

    # Internal HTTP port 8085 sets HTTP proto header
    http-request set-header X-Forwarded-Proto http if is_internal_8085
    http-request set-header X-Forwarded-Port 8085  if is_internal_8085
    use_backend app_nodes if is_internal_8085

    # Public Port 80: handle LB headers or redirect to HTTPS
    http-request set-header X-Forwarded-Proto https if from_lb or is_forwarded_https
    http-request set-header X-Forwarded-Port 443    if from_lb or is_forwarded_https
    http-request redirect scheme https code 301 unless from_lb or is_forwarded_https or is_acme or is_internal_8085
    default_backend app_nodes

# HTTPS Frontend (Port 443 standard HTTPS & Port 7085 legacy HTTPS)
frontend https-in
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem alpn h2,http/1.1
    bind *:7085 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port %[dst_port]
    http-response set-header Strict-Transport-Security max-age=31536000
    default_backend app_nodes

# Docker DNS (used by the Octane canary server so HAProxy still boots if that container is absent)
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

# Backend App Nodes
backend app_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /up ver HTTP/1.1 hdr Host localhost
    http-check expect status 200-399
    cookie SERVERID insert indirect nocache
    server web-1 web-1:80 check cookie web1
    server web-2 web-2:80 check cookie web2
    # Octane canary: stays 'disabled' (no traffic, no checks) until enabled at runtime:
    #   set server app_nodes/web-octane-1 state ready
    server web-octane-1 web-octane-1:80 check cookie octane1 weight 1 disabled resolvers docker init-addr none

# Optional: Database Read-Write Splitting (Advanced)
# frontend mysql-cluster
#     bind *:3306
#     mode tcp
#     default_backend mysql-primary
