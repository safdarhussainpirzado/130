global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

# Stats Page
listen stats
    bind *:8404
    stats enable
    stats uri /monitor
    stats refresh 5s
    stats auth admin:admin123

# HTTP Frontend (Redirects to HTTPS)
frontend http-in
    bind *:80
    http-request redirect scheme https unless { ssl_fc }

# HTTPS Frontend
frontend https-in
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/130_nhmp_gov_pk.pem
    http-response set-header Strict-Transport-Security max-age=31536000
    default_backend app_nodes

# Backend App Nodes
backend app_nodes
    balance roundrobin
    option httpchk
    http-check send meth GET uri /up ver HTTP/1.1 hdr Host localhost
    http-check expect status 200-399
    cookie SERVERID insert indirect nocache
    server web-1 web-1:80 check cookie web1
    server web-2 web-2:80 check cookie web2

# Optional: Database Read-Write Splitting (Advanced)
# frontend mysql-cluster
#     bind *:3306
#     mode tcp
#     default_backend mysql-primary
