global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

# Stats Page
listen stats
    bind *:8404
    stats enable
    stats uri /monitor
    stats refresh 5s
    stats auth admin:admin123

# External HTTPS Frontend
frontend https-external
    bind *:7085 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem
    default_backend app_nodes

# Internal Call Center Frontend
frontend http-internal
    bind *:8085
    default_backend app_nodes

# Standard Frontends (Redirects)
frontend http-in
    bind *:80
    http-request redirect scheme https unless { ssl_fc }

frontend https-in
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem
    default_backend app_nodes

# Backend App Nodes
backend app_nodes
    balance roundrobin
    http-check send meth GET uri /up ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    cookie SERVERID insert indirect nocache
    server web-1 web-1:80 check cookie web1
    server web-2 web-2:80 check cookie web2

# Optional: Database Read-Write Splitting (Advanced)
# frontend mysql-cluster
#     bind *:3306
#     mode tcp
#     default_backend mysql-primary
