$kind: http-request
name: "A3 Active case (none expected)"
description: Active case (none expected)
url: "{{base_url}}/api/v1/commuter/cases/active"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
