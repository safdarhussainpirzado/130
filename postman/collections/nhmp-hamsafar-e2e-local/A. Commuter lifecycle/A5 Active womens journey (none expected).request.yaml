$kind: http-request
name: "A5 Active womens journey (none expected)"
description: Active womens journey (none expected)
url: "{{base_url}}/api/v1/womens-journey/active"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
