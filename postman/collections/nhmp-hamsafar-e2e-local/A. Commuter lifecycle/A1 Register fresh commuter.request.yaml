$kind: http-request
name: "A1 Register fresh commuter"
description: Register fresh commuter
url: "{{base_url}}/api/v1/auth/commuter/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Postman E2E Test",
      "email": "{{test_email}}",
      "password": "LocalTest#2026pw",
      "password_confirmation": "LocalTest#2026pw",
      "device_name": "postman-e2e"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('test_email', 'pmtest+' + Date.now() + '@example.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      const j=pm.response.json();
      pm.test('Returns access_token', () => pm.expect(j.access_token).to.be.a('string').and.not.empty);
      pm.collectionVariables.set('access_token', j.access_token);
    language: text/javascript
order: 1000
