$kind: http-request
name: "A2 Get profile"
description: Get profile
url: "{{base_url}}/api/v1/commuter/profile"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON body', () => pm.response.to.be.json);
    language: text/javascript
order: 2000
