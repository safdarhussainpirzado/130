$kind: http-request
name: "B4 Women journey desk queue -> 403"
description: Women journey desk queue -> 403
url: "{{base_url}}/api/v1/womens-journey/desk-queue"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
      pm.test('No personal data in body', () => pm.expect(pm.response.text()).to.not.match(/cnic|emergency_contacts|passenger/i));
    language: text/javascript
order: 4000
