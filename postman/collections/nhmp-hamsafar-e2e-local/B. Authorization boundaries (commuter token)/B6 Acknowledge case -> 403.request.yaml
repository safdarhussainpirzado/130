$kind: http-request
name: "B6 Acknowledge case -> 403"
description: Acknowledge case -> 403
url: "{{base_url}}/api/v1/cases/00000000-0000-4000-8000-000000000000/acknowledge"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {}
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 403', () => pm.response.to.have.status(403));
      pm.test('No personal data in body', () => pm.expect(pm.response.text()).to.not.match(/cnic|emergency_contacts|passenger/i));
    language: text/javascript
order: 6000
