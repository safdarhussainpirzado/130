$kind: http-request
name: "1.11 Cases: Get Commuter Case History"
description: Retrieves resolved case history for this commuter.
url: "{{base_url}}/api/v1/commuter/cases/history"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{commuter_token}}"
order: 11000
