$kind: http-request
name: "1.10 Case Chat: Send Message / Location Card"
description: "Screen 10: Commuter sends message or location card to assigned patrol."
url: "{{base_url}}/api/v1/cases/{{case_uuid}}/messages"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "message_type": "text",
      "audience": "shared_case",
      "content": "We are parked on emergency shoulder near KM 231 with hazard lights on.",
      "latitude": 32.7812,
      "longitude": 72.7049
    }
auth:
  type: bearer
  credentials:
    token: "{{commuter_token}}"
order: 10000
