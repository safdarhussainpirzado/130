$kind: http-request
name: "1.3 Auth: Email Login"
description: Commuter email and password login.
url: "{{base_url}}/api/v1/auth/commuter/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "zainab.bibi@example.com",
      "password": "SecurePassword123!"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var json = pm.response.json();
          if (json.access_token) {
              pm.environment.set('commuter_token', json.access_token);
              console.log('Commuter Token updated.');
          }
      }
    language: text/javascript
order: 3000
