$kind: http-request
name: "1.6 SOS: Trigger Roadside Emergency SOS"
description: "View 08/14: Commuter triggers emergency SOS. Creates Call entity in 130 CRM."
url: "{{base_url}}/api/v1/commuter/sos"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "latitude": 32.7812,
      "longitude": 72.7049,
      "problem_type": "Vehicle Breakdown",
      "details": "Engine stalled near KM 231 south of Kallar Kahar interchange.",
      "carriageway": "Southbound (Lahore Bound)",
      "km_marker": "KM 231",
      "vehicle_no": "ICT-LE-921"
    }
auth:
  type: bearer
  credentials:
    token: "{{commuter_token}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          var json = pm.response.json();
          if (json.case_uuid) {
              pm.environment.set('case_uuid', json.case_uuid);
              console.log('Active Case UUID saved: ' + json.case_uuid);
          }
      }
    language: text/javascript
order: 6000
