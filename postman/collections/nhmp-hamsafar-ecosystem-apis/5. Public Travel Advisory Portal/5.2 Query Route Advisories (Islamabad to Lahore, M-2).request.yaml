$kind: http-request
name: "5.2 Query Route Advisories (Islamabad to Lahore, M-2)"
description: Advisories for a route; empty list with sample_mode when none exist.
url: "{{base_url}}/api/v1/travel-advisory/query?from=Islamabad&to=Lahore&road=M-2"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
      pm.test('Responds under 5s (cold local cache)', () => pm.expect(pm.response.responseTime).to.be.below(5000));
      const j = pm.response.json(); pm.test('Has route, counters, advisories', () => { pm.expect(j).to.have.property('route'); pm.expect(j).to.have.property('counters'); pm.expect(j.advisories).to.be.an('array'); });
      pm.test('Route is M-2', () => pm.expect(j.route.code).to.eql('M-2'));
    language: text/javascript
order: 2000
