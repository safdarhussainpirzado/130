$kind: http-request
name: "5.1 List Routes"
description: Highway routes and carriageways.
url: "{{base_url}}/api/v1/travel-advisory/routes"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
      pm.test('Responds under 5s (cold local cache)', () => pm.expect(pm.response.responseTime).to.be.below(5000));
      const j = pm.response.json(); pm.test('Returns a non-empty route list', () => pm.expect(JSON.stringify(j).length).to.be.above(100));
    language: text/javascript
order: 1000
