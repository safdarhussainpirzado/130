$kind: http-request
name: "5.4 GeoJSON"
description: Map geometry for Leaflet.
url: "{{base_url}}/api/v1/travel-advisory/geojson"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
      pm.test('Responds under 5s (cold local cache)', () => pm.expect(pm.response.responseTime).to.be.below(5000));
      const j = pm.response.json(); pm.test('Valid FeatureCollection', () => { pm.expect(j.type).to.eql('FeatureCollection'); pm.expect(j.features).to.be.an('array'); });
    language: text/javascript
order: 4000
