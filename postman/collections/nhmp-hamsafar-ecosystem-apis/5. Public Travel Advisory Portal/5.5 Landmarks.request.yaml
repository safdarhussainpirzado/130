$kind: http-request
name: "5.5 Landmarks"
description: Geospatial landmarks (caller-location helper).
url: "{{base_url}}/api/v1/travel-advisory/landmarks"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('JSON response', () => pm.response.to.be.json);
      pm.test('Responds under 5s (cold local cache)', () => pm.expect(pm.response.responseTime).to.be.below(5000));
      pm.test('Returns landmark data', () => pm.expect(pm.response.text().length).to.be.above(100));
    language: text/javascript
order: 5000
