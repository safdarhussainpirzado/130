id: 8d3f11a4-9e72-4b82-bf56-c09a471e9812
name: NHMP Hamsafar Ecosystem APIs (v1.0)
description: |-
  Authoritative API collection for National Highways & Motorway Police (NHMP) Hamsafar Ecosystem.

  Serves two mobile clients:
  1. Hamsafar Road User / Commuter App (1-Tap Google & Email Auth, Profile Management, Emergency SOS, Case Chat, Live Patrol Tracking, and Women's Journey Safety WJ-204)
  2. Hamsafar Patrol App (Screen 01-18: Tactical Login, Screen 02 Duty Setup with P-12 binding, Screen 03 Redis Telemetry Buffer, Screen 04-16 Case H-1042 Response Lifecycle, Support Requests, Completion Reports)
  3. Public Travel Advisories Platform
