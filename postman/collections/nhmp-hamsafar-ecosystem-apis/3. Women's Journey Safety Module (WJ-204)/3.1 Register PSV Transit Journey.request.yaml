$kind: http-request
description: "Screens W01-W05: Registers PSV travel parameters. Starts active transit monitoring."
url: "{{base_url}}/api/v1/womens-journey/register"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "origin_city": "Rawalpindi",
      "origin_stop": "Faizabad Bus Terminal",
      "destination_city": "Lahore",
      "destination_stop": "Thokar Niaz Baig Terminal",
      "psv_company_name": "Daewoo Express",
      "psv_reg_no": "BS-942",
      "psv_seat_no": "14-B",
      "notes": "Traveling solo on night executive coach."
    }
auth:
  type: bearer
  credentials:
    token: "{{commuter_token}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          var json = pm.response.json();
          if (json.journey_uuid) {
              pm.environment.set('journey_uuid', json.journey_uuid);
              console.log('Journey UUID saved: ' + json.journey_uuid);
          }
      }
    language: text/javascript
order: 1000
