$kind: http-request
description: "Screen W11: Discreet silent alert. Triggers Priority 1 Alarm at 130 Women's Desk."
url: "{{base_url}}/api/v1/womens-journey/{{journey_uuid}}/alert"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "latitude": 32.214,
      "longitude": 73.201
    }
auth:
  type: bearer
  credentials:
    token: "{{commuter_token}}"
order: 4000
