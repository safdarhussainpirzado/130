$kind: http-request
name: 3.3 Post Milestone Check-In / In-Transit Note
description: "Screen W08/W10: Passenger posts transit note or milestone check-in."
url: "{{base_url}}/api/v1/womens-journey/{{journey_uuid}}/updates"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "update_type": "check_in",
      "content": "Bus stopped at Bhera rest area for 15 minutes break.",
      "location_name": "Bhera Rest Area M-2",
      "latitude": 32.48201,
      "longitude": 72.9124
    }
auth:
  type: bearer
  credentials:
    token: "{{commuter_token}}"
order: 3000
