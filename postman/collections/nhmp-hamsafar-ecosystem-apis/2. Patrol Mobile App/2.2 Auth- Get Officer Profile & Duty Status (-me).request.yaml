$kind: http-request
name: "2.2 Auth: Get Officer Profile & Duty Status (/me)"
description: Returns officer identity, designation, assigned beat, and active duty status.
url: "{{base_url}}/api/v1/patrol/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{staff_token}}"
order: 2000
