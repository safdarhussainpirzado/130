$kind: http-request
name: "2.11 Cases: Screen 06 Cannot Respond (Return to Control)"
description: "Screen 06: Officer declines assignment with mandatory reason. Returns case to Control."
url: "{{base_url}}/api/v1/cases/{{case_uuid}}/cannot-respond"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Engaged with fatal collision on opposite carriageway KM 229."
    }
auth:
  type: bearer
  credentials:
    token: "{{staff_token}}"
order: 11000
