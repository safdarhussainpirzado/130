$kind: http-request
name: "2.15 Cases: Screen 13 Submit Completion Report"
description: "Screen 13: Officer submits report. Enters review_pending state for Control Room."
url: "{{base_url}}/api/v1/cases/{{case_uuid}}/complete-assistance"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "outcome": "resolved",
      "public_summary": "Vehicle escorted safely to Bhera service area. Minor coolant leak repaired.",
      "internal_control_note": "Driver was cooperative. Incident caused no blockage."
    }
auth:
  type: bearer
  credentials:
    token: "{{staff_token}}"
order: 15000
