version: "3"

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php ./app/Octane/roadrunner_worker.php"
  relay: pipes

http:
  address: "0.0.0.0:8000"
  max_request_size: 64
  middleware: ["gzip"]
  pool:
    num_workers: 4
    max_jobs: 1000
    allocate_timeout: 60s
    destroy_timeout: 60s
    supervisor:
      watch_tick: 1s
      ttl: 3600s
      idle_ttl: 600s
      max_worker_memory: 128

logs:
  mode: production
  level: warn
  encoding: json
